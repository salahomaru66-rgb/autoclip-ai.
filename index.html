
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoClip AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:600px;margin:auto}
h1{text-align:center;color:#70e1ff}
p{color:#b9c2d9;text-align:center}
.panel{background:#1b2135;padding:20px;border-radius:16px;margin-top:20px}
input,select,button{width:100%;padding:14px;margin-top:12px;border-radius:9px;border:0;font-size:16px}
button{background:#40c9e8;color:#101322;font-weight:bold}
video{width:100%;margin-top:15px;border-radius:10px}
.clip{background:#252e46;padding:12px;margin-top:12px;border-radius:10px}
a{color:#70e1ff}
small{color:#b9c2d9}
</style>
</head>
<body>
<main>
<h1>AutoClip AI</h1>
<p>Create short videos from your phone</p>

<div class="panel">
<h3>1. Upload your video</h3>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls hidden></video>

<h3>2. Choose clips</h3>
<select id="clipCount">
<option value="5">5 clips</option>
<option value="10">10 clips</option>
</select>

<h3>3. Video format</h3>
<select id="format">
<option value="9:16">9:16 - YouTube Shorts / TikTok</option>
<option value="16:9">16:9 - Landscape</option>
</select>

<button id="create">Create Clips</button>
<div id="results"></div>
</div>
</main>

<script>
const fileInput=document.getElementById("videoFile");
const preview=document.getElementById("preview");
const results=document.getElementById("results");
let videoURL=null;

fileInput.addEventListener("change",()=>{
 const file=fileInput.files[0];
 if(!file)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 preview.src=videoURL;
 preview.hidden=false;
 results.innerHTML="";
});

document.getElementById("create").addEventListener("click",()=>{
 const file=fileInput.files[0];
 if(!file){alert("Please choose a video first.");return;}
 const count=Number(document.getElementById("clipCount").value);
 results.innerHTML="<p>Preparing clips...</p>";
 const video=document.createElement("video");
 video.preload="metadata";
 video.src=videoURL;
 video.onloadedmetadata=()=>{
  const duration=video.duration;
  const segment=duration/count;
  results.innerHTML="<h3>Your clip sections</h3>";
  for(let i=0;i<count;i++){
   const start=i*segment;
   const end=Math.min((i+1)*segment,duration);
   const item=document.createElement("div");
   item.className="clip";
   item.innerHTML="<b>Clip "+(i+1)+"</b><br>"+
   "Start: "+start.toFixed(1)+"s<br>"+
   "End: "+end.toFixed(1)+"s<br>"+
   "<small>Section ready for editing and export.</small>";
   results.appendChild(item);
  }
  const note=document.createElement("p");
  note.textContent="These are clip sections, not exported video files yet. AI highlight detection and automatic 9:16 rendering require a processing server.";
  results.appendChild(note);
 };
 video.onerror=()=>{results.textContent="Could not read this video. Try another file.";};
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoClip AI</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px;
  background: #121a30;
  text-align: center;
  border-bottom: 1px solid #263452;
}
header h1 {
  color: #55aaff;
  margin: 0;
}
header p {
  color: #9baac4;
}
.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 18px;
}
.card {
  background: #151f35;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 18px;
}
h2 {
  font-size: 19px;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
}
input {
  background: #0b1020;
  color: white;
  border: 1px solid #344664;
}
button {
  background: #2586ff;
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
}
video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: black;
}
.status {
  color: #65d9a0;
  margin-top: 15px;
  font-size: 14px;
}
label {
  display: block;
  margin-top: 15px;
  color: #bdc9df;
}
</style>
</head>

<body>

<header>
<h1>⚡ AUTOCLIP AI</h1>
<p>AI Gaming Video Clipper</p>
</header>

<div class="container">

<div class="card">
<h2>📁 Upload Video</h2>
<input type="file" id="upload" accept="video/*">
<video id="video" controls></video>
</div>

<div class="card">
<h2>✂️ Create Your Clip</h2>

<label>Start time (seconds)</label>
<input type="number" id="start" value="0" min="0">

<label>End time (seconds)</label>
<input type="number" id="end" value="30" min="1">

<button id="create">Create Clip</button>

<p class="status" id="status">
Upload a video to get started.
</p>
</div>

<div class="card">
<h2>⬇️ Your Clip</h2>
<a id="download" style="display:none;color:#65d9a0">
Download your video
</a>
</div>

</div>

<script>
const upload = document.getElementById("upload");
const video = document.getElementById("video");
const start = document.getElementById("start");
const end = document.getElementById("end");
const create = document.getElementById("create");
const status = document.getElementById("status");
const download = document.getElementById("download");

let videoURL = null;

upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (!file) return;

  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(file);
  video.src = videoURL;

  video.onloadedmetadata = () => {
    start.value = 0;
    end.value = Math.floor(video.duration);
    status.textContent = "Video ready!";
  };
});

create.addEventListener("click", async () => {
  const from = Number(start.value);
  const to = Number(end.value);

  if (!video.src || !upload.files.length) {
    status.textContent = "Please upload a video first.";
    return;
  }

  if (!Number.isFinite(from) || !Number.isFinite(to) ||
      from < 0 || to <= from || to > video.duration) {
    status.textContent = "Please enter valid start and end times.";
    return;
  }

  if (!video.captureStream || !window.MediaRecorder) {
    status.textContent = "Your browser does not support video recording.";
    return;
  }

  create.disabled = true;
  download.style.display = "none";
  status.textContent = "Creating your clip...";

  try {
    video.pause();
    video.currentTime = from;

    await new Promise((resolve, reject) => {
      video.onseeked = resolve;
      video.onerror = reject;
    });

    const stream = video.captureStream();
    const mime = [
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ].find(type => MediaRecorder.isTypeSupported(type));

    if (!mime) throw new Error("Recording format unavailable");

    const recorder = new MediaRecorder(stream, {mimeType: mime});
    const chunks = [];

    recorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, {type: mime});
      const url = URL.createObjectURL(blob);

      download.href = url;
      download.download = "autoclip.webm";
      download.textContent = "⬇️ Download Your Clip";
      download.style.display = "block";

      status.textContent = "Your clip is ready!";
      create.disabled = false;
    };

    recorder.onerror = () => {
      status.textContent = "Recording failed. Try another video.";
      create.disabled = false;
    };

    video.onended = () => {
      if (recorder.state === "recording") recorder.stop();
    };

    recorder.start(250);
    await video.play();

    const check = setInterval(() => {
      if (video.currentTime >= to && recorder.state === "recording") {
        clearInterval(check);
        video.pause();
        recorder.stop();
      }
    }, 100);

  } catch (error) {
    status.textContent = "Error: " + error.message;
    create.disabled = false;
  }
});
</script>

</body>
</html>
